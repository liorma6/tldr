name: Verify Hebrew git-init translation
run-name: Compare the original pages with the Hebrew git-init translation
on:
  push:
    branches:
      - ci/verify-git-init-he
permissions:
  contents: read
jobs:
  verify:
    name: Repository checks ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: baseline
            ref: cd2bed84c9318e39e00b6d0cb9649b1fa1d7caf9
          - version: translation
            ref: b62328d0d099007c3c03678394ed6e1371affd42
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: liorma6/tldr
          ref: ${{ matrix.ref }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 'lts/*'
      - name: Install locked JavaScript dependencies
        run: npm ci
      - name: Install Python validation dependencies
        run: pip install -r requirements.txt -r scripts/pdf/requirements.txt -r scripts/test-requirements.txt
      - name: Run the repository test suite
        run: npm test
      - name: Build the repository
        run: bash scripts/build.sh
